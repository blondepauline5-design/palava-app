<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palava</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316221F'/%3E%3Cpath d='M14 20c0-3.3 2.7-6 6-6h24c3.3 0 6 2.7 6 6v16c0 3.3-2.7 6-6 6H28l-9 8v-8h-3c-3.3 0-6-2.7-6-6V20z' fill='%23F0B23A'/%3E%3Ccircle cx='24' cy='27' r='2.6' fill='%2316221F'/%3E%3Ccircle cx='32' cy='27' r='2.6' fill='%2316221F'/%3E%3Ccircle cx='40' cy='27' r='2.6' fill='%2316221F'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg: #16221F;
    --bg-panel: #1E2F2A;
    --cream: #FBF3E4;
    --gold: #F0B23A;
    --terra: #D9622B;
    --teal: #2E7D6E;
    --text: #FBF3E4;
    --text-dim: #A9B8B0;
    --bubble-me: #2E7D6E;
    --bubble-them: #2A3F38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#0B120F;height:100%;}
  #palava-root{
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    width:100%;
    max-width:480px;
    margin:0 auto;
    height:100vh;
    max-height:720px;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position:relative;
  }
  @media (min-width:520px){
    body{ display:flex; align-items:center; justify-content:center; }
    #palava-root{ border-radius:20px; margin-top:20px; margin-bottom:20px; }
  }
  .header-pattern{
    height:6px; width:100%;
    background: repeating-linear-gradient(-45deg, var(--gold) 0px, var(--gold) 10px, var(--terra) 10px, var(--terra) 20px, var(--teal) 20px, var(--teal) 30px);
    flex-shrink:0;
  }
  .screen{ flex:1; display:none; flex-direction:column; min-height:0; }
  .screen.active{ display:flex; }
  button{ font-family:inherit; }

  #login-screen{ align-items:center; justify-content:center; padding:32px; text-align:center; gap:18px; }
  .logo-mark{ font-family: Georgia, serif; font-size:42px; font-weight:700; letter-spacing:0.5px; color:var(--gold); margin-top:4px; }
  .logo-sub{ color:var(--text-dim); font-size:14px; margin-top:-12px; letter-spacing:0.5px; }
  .text-input{ width:100%; max-width:280px; padding:14px 16px; border-radius:12px; border:1px solid #3A4E47; background:var(--bg-panel); color:var(--text); font-size:15px; outline:none; }
  .text-input:focus{ border-color: var(--gold); }
  .primary-btn{ width:100%; max-width:280px; padding:14px; border-radius:12px; border:none; background:var(--terra); color:var(--cream); font-size:15px; font-weight:600; cursor:pointer; transition: transform 0.15s ease, background 0.15s ease; }
  .primary-btn:hover{ background:#C1541F; transform: translateY(-1px); }
  .primary-btn:active{ transform: translateY(0); }
  .login-note{ color:var(--text-dim); font-size:12px; max-width:280px; line-height:1.5; }
  .creator-credit{ color:var(--text-dim); font-size:11px; opacity:0.7; margin-top:8px; letter-spacing:0.3px; }

  #list-screen{ min-height:0; }
  .list-header{ display:flex; align-items:center; gap:10px; padding:14px 18px; background:var(--bg-panel); border-bottom:1px solid #2A3F38; flex-shrink:0; }
  .room-badge{ width:38px;height:38px;border-radius:10px; background:linear-gradient(135deg, var(--gold), var(--terra)); display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .list-title{ font-weight:600; font-size:15px; }
  .list-sub{ font-size:11px; color:var(--text-dim); }
  #logout-btn{
    margin-left:auto;
    background:none;
    border:1px solid #3A4E47;
    color:var(--text-dim);
    font-size:11px;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  #logout-btn:hover{ border-color:var(--terra); color:var(--terra); }

  #new-convo-bar{ display:flex; gap:8px; padding:12px 14px; border-bottom:1px solid #2A3F38; flex-shrink:0; }
  #new-convo-input{ flex:1; padding:10px 12px; border-radius:20px; border:1px solid #3A4E47; background:var(--bg-panel); color:var(--text); font-size:13px; outline:none; }
  #new-convo-input:focus{ border-color:var(--gold); }
  #new-convo-btn{ padding:0 16px; border-radius:20px; border:none; background:var(--teal); color:var(--cream); font-size:13px; font-weight:600; cursor:pointer; }
  #new-convo-btn:hover{ background:#256A5D; }

  #contact-list{ flex:1; overflow-y:auto; padding:8px; }
  .contact-row{ display:flex; align-items:center; gap:12px; padding:12px 10px; border-radius:12px; cursor:pointer; transition: background 0.12s ease; }
  .contact-row:hover{ background:var(--bg-panel); }
  .contact-avatar{ width:40px;height:40px;border-radius:50%; background: linear-gradient(135deg, var(--teal), #1B4A40); display:flex;align-items:center;justify-content:center; font-weight:700; font-size:15px; color:var(--cream); flex-shrink:0; }
  .contact-name{ font-size:14px; font-weight:600; }
  .contact-preview{ font-size:12px; color:var(--text-dim); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty-list{ margin:40px auto; text-align:center; color:var(--text-dim); font-size:13px; max-width:220px; line-height:1.6; }

  #chat-screen{ min-height:0; }
  .chat-header{ display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--bg-panel); border-bottom:1px solid #2A3F38; flex-shrink:0; }
  #back-btn{ background:none;border:none;color:var(--text); font-size:20px; cursor:pointer; padding:2px 6px 2px 0; }
  .chat-title{ font-weight:600; font-size:15px; }
  .chat-sub{ font-size:11px; color:var(--text-dim); }

  #messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .empty-state{ margin:auto; text-align:center; color:var(--text-dim); font-size:13px; max-width:220px; line-height:1.6; }
  .msg-row{ display:flex; }
  .msg-row.me{ justify-content:flex-end; }
  .bubble{ max-width:75%; padding:9px 13px; border-radius:16px; font-size:14px; line-height:1.4; position:relative; word-wrap:break-word; }
  .delete-btn{
    position:absolute;
    top:-8px;
    right:-8px;
    width:20px;height:20px;
    border-radius:50%;
    border:none;
    background:#3A2020;
    color:#E08B8B;
    font-size:11px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:0.55;
    transition:opacity 0.15s ease;
  }
  .bubble:hover .delete-btn, .delete-btn:active{ opacity:1; }
  .msg-row.them .bubble{ background:var(--bubble-them); border-bottom-left-radius:4px; }
  .msg-row.me .bubble{ background:var(--bubble-me); border-bottom-right-radius:4px; }
  .bubble .time{ font-size:9.5px; color:var(--text-dim); margin-top:3px; display:block; text-align:right; }

  .composer{ display:flex; gap:8px; padding:12px; background:var(--bg-panel); border-top:1px solid #2A3F38; flex-shrink:0; }
  #msg-input{ flex:1; padding:12px 14px; border-radius:20px; border:1px solid #3A4E47; background:var(--bg); color:var(--text); font-size:14px; outline:none; resize:none; }
  #msg-input:focus{ border-color:var(--gold); }
  #send-btn{ width:44px;height:44px; border-radius:50%; border:none; background:var(--terra); color:var(--cream); font-size:16px; cursor:pointer; display:flex;align-items:center;justify-content:center; flex-shrink:0; transition: background 0.15s ease; }
  #send-btn:hover{ background:#C1541F; }
  #send-btn:disabled{ opacity:0.4; cursor:default; }
  #mic-btn{ width:44px;height:44px; border-radius:50%; border:none; background:var(--teal); color:var(--cream); font-size:16px; cursor:pointer; display:flex;align-items:center;justify-content:center; flex-shrink:0; transition: background 0.15s ease; }
  #mic-btn:hover{ background:#256A5D; }
  #mic-btn.recording{ background:var(--terra); animation: pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  .voice-bubble{ display:flex; align-items:center; gap:8px; min-width:150px; }
  .voice-bubble button{ width:30px;height:30px;border-radius:50%; border:none; background:rgba(0,0,0,0.25); color:var(--cream); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .voice-bubble .voice-label{ font-size:12px; color:var(--text-dim); }

  .status-line{ font-size:10px; color:var(--text-dim); text-align:center; padding:4px 0 0 0; }
  .conn-dot{ width:7px;height:7px;border-radius:50%; background:#666; display:inline-block; margin-right:5px; }
  .conn-dot.ok{ background:#4CAF50; }
</style>
</head>
<body>

<div id="palava-root">
  <div class="header-pattern"></div>

  <div id="login-screen" class="screen active">
    <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="16" fill="#1E2F2A"/>
      <path d="M14 20c0-3.3 2.7-6 6-6h24c3.3 0 6 2.7 6 6v16c0 3.3-2.7 6-6 6H28l-9 8v-8h-3c-3.3 0-6-2.7-6-6V20z" fill="#F0B23A"/>
      <circle cx="24" cy="27" r="2.6" fill="#1E2F2A"/>
      <circle cx="32" cy="27" r="2.6" fill="#1E2F2A"/>
      <circle cx="40" cy="27" r="2.6" fill="#1E2F2A"/>
    </svg>
    <div class="logo-mark">Palava</div>
    <div class="logo-sub">des conversations, juste entre vous deux</div>
    <input id="username-input" class="text-input" type="text" placeholder="Votre nom (ex: Daniel)" maxlength="20" />
    <button id="enter-btn" class="primary-btn">Entrer</button>
    <div class="login-note"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">Connexion à la base de données...</span></div>
    <div class="creator-credit">Créé par ZADI SERI DANIEL PHINE</div>
  </div>

  <div id="list-screen" class="screen">
    <div class="list-header">
      <div class="room-badge">
        <svg width="22" height="22" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 20c0-3.3 2.7-6 6-6h24c3.3 0 6 2.7 6 6v16c0 3.3-2.7 6-6 6H28l-9 8v-8h-3c-3.3 0-6-2.7-6-6V20z" fill="#1A1208"/>
          <circle cx="24" cy="27" r="2.6" fill="#F0B23A"/>
          <circle cx="32" cy="27" r="2.6" fill="#F0B23A"/>
          <circle cx="40" cy="27" r="2.6" fill="#F0B23A"/>
        </svg>
      </div>
      <div>
        <div class="list-title">Conversations</div>
        <div class="list-sub" id="me-label"></div>
      </div>
      <button id="logout-btn" title="Changer de nom">Quitter</button>
    </div>
    <div id="new-convo-bar">
      <input id="new-convo-input" type="text" placeholder="Discuter avec... (nom)" maxlength="20" />
      <button id="new-convo-btn">Ouvrir</button>
    </div>
    <div id="contact-list">
      <div class="empty-list">Aucune conversation pour l'instant.<br/>Entrez un nom ci-dessus pour commencer 👋</div>
    </div>
  </div>

  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <button id="back-btn">←</button>
      <div>
        <div class="chat-title" id="chat-with-name"></div>
        <div class="chat-sub">conversation privée</div>
      </div>
    </div>
    <div id="messages">
      <div class="empty-state">Aucun message pour l'instant.<br/>Dites bonjour 👋</div>
    </div>
    <div class="composer">
      <input id="msg-input" type="text" placeholder="Écrire un message..." maxlength="500" />
      <button id="mic-btn" title="Message vocal">🎤</button>
      <button id="send-btn">➤</button>
    </div>
    <div class="status-line" id="status-line">&nbsp;</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyDHc82KR8Bv679WMw0--lpvDtUCqiYlVqw",
    authDomain: "palava-app.firebaseapp.com",
    databaseURL: "https://palava-app-default-rtdb.firebaseio.com",
    projectId: "palava-app",
    storageBucket: "palava-app.firebasestorage.app",
    messagingSenderId: "601397555646",
    appId: "1:601397555646:web:8f91ffabf955d0af7c49ef",
    measurementId: "G-0BNJ2HSED1"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let username = null;
  let currentPeer = null;
  let currentMsgsRef = null;
  let currentMsgsHandler = null;

  const loginScreen = document.getElementById('login-screen');
  const usernameInput = document.getElementById('username-input');
  const enterBtn = document.getElementById('enter-btn');
  const meLabel = document.getElementById('me-label');
  const connDot = document.getElementById('conn-dot');
  const connText = document.getElementById('conn-text');

  const newConvoInput = document.getElementById('new-convo-input');
  const newConvoBtn = document.getElementById('new-convo-btn');
  const contactList = document.getElementById('contact-list');

  const backBtn = document.getElementById('back-btn');
  const chatWithName = document.getElementById('chat-with-name');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn = document.getElementById('mic-btn');
  const messagesEl = document.getElementById('messages');
  const statusLine = document.getElementById('status-line');
  const logoutBtn = document.getElementById('logout-btn');

  db.ref('.info/connected').on('value', snap => {
    if(snap.val() === true){
      connDot.classList.add('ok');
      connText.textContent = 'Connecté à la base de données';
    }else{
      connDot.classList.remove('ok');
      connText.textContent = 'Connexion à la base de données...';
    }
  });

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function safeKey(name){
    return name.trim().toLowerCase().replace(/[.#$\[\]\/\s]/g, '_');
  }
  function pairKey(a, b){
    return [safeKey(a), safeKey(b)].sort().join('__');
  }
  function initials(name){
    return name.trim().slice(0,2).toUpperCase();
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function formatTime(ts){
    const d = new Date(ts);
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  // Add each user to the other's contact list (both directions)
  function ensureContact(user, peer){
    const updates = {};
    updates['contacts/' + safeKey(user) + '/' + safeKey(peer)] = peer;
    updates['contacts/' + safeKey(peer) + '/' + safeKey(user)] = user;
    return db.ref().update(updates);
  }

  function renderContactList(){
    db.ref('contacts/' + safeKey(username)).once('value').then(snap => {
      const val = snap.val() || {};
      const peers = Object.values(val);
      if(peers.length === 0){
        contactList.innerHTML = '<div class="empty-list">Aucune conversation pour l\'instant.<br/>Entrez un nom ci-dessus pour commencer 👋</div>';
        return;
      }
      contactList.innerHTML = '';
      let pending = peers.length;
      const rows = {};
      peers.forEach(peer => {
        const key = pairKey(username, peer);
        db.ref('conversations/' + key).limitToLast(1).once('value').then(msnap => {
          const val2 = msnap.val() || {};
          const arr = Object.values(val2);
          const last = arr.length ? arr[arr.length - 1] : null;
          const lastPreview = last ? (last.type === 'voice' ? '🎤 message vocal' : last.text) : 'Aucun message';
          const row = document.createElement('div');
          row.className = 'contact-row';
          row.innerHTML = `
            <div class="contact-avatar">${initials(peer)}</div>
            <div>
              <div class="contact-name">${escapeHtml(peer)}</div>
              <div class="contact-preview">${last ? (last.user === username ? 'Vous: ' : '') + escapeHtml(lastPreview) : 'Aucun message'}</div>
            </div>
          `;
          row.addEventListener('click', () => openChat(peer));
          rows[peer] = row;
          pending--;
          if(pending === 0){
            peers.forEach(p => contactList.appendChild(rows[p]));
          }
        });
      });
    });
  }

  function renderMessages(list){
    if(list.length === 0){
      messagesEl.innerHTML = '<div class="empty-state">Aucun message pour l\'instant.<br/>Dites bonjour 👋</div>';
      return;
    }
    messagesEl.innerHTML = '';
    list.forEach(m => {
      const row = document.createElement('div');
      row.className = 'msg-row ' + (m.user.toLowerCase() === username.toLowerCase() ? 'me' : 'them');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if(m.type === 'voice' && m.audio){
        bubble.classList.add('voice-bubble');
        const playBtn = document.createElement('button');
        playBtn.textContent = '▶';
        const audioEl = new Audio(m.audio);
        let playing = false;
        playBtn.addEventListener('click', () => {
          if(playing){
            audioEl.pause();
          }else{
            audioEl.currentTime = 0;
            audioEl.play();
          }
        });
        audioEl.addEventListener('play', () => { playing = true; playBtn.textContent = '❚❚'; });
        audioEl.addEventListener('pause', () => { playing = false; playBtn.textContent = '▶'; });
        audioEl.addEventListener('ended', () => { playing = false; playBtn.textContent = '▶'; });
        const label = document.createElement('span');
        label.className = 'voice-label';
        label.textContent = '🎤 message vocal';
        bubble.appendChild(playBtn);
        bubble.appendChild(label);
      }else{
        const textEl = document.createElement('div');
        textEl.textContent = m.text;
        bubble.appendChild(textEl);
      }

      const timeEl = document.createElement('span');
      timeEl.className = 'time';
      timeEl.textContent = formatTime(m.ts);
      bubble.appendChild(timeEl);

      if(m.user.toLowerCase() === username.toLowerCase() && m.id){
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.title = 'Supprimer ce message';
        delBtn.addEventListener('click', () => deleteMessage(m.id));
        bubble.appendChild(delBtn);
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function deleteMessage(msgId){
    if(!currentPeer) return;
    if(!confirm('Supprimer ce message ?')) return;
    const key = pairKey(username, currentPeer);
    db.ref('conversations/' + key + '/' + msgId).remove()
      .catch(() => { alert("Impossible de supprimer ce message."); });
  }

  function openChat(peer){
    currentPeer = peer;
    chatWithName.textContent = peer;
    showScreen('chat-screen');
    messagesEl.innerHTML = '<div class="empty-state">Chargement...</div>';

    if(currentMsgsRef && currentMsgsHandler){
      currentMsgsRef.off('value', currentMsgsHandler);
    }
    const key = pairKey(username, peer);
    currentMsgsRef = db.ref('conversations/' + key).orderByChild('ts');
    currentMsgsHandler = currentMsgsRef.on('value', snap => {
      const list = [];
      snap.forEach(child => {
        list.push(Object.assign({ id: child.key }, child.val()));
      });
      list.sort((a,b) => a.ts - b.ts);
      renderMessages(list);
    });
    msgInput.focus();
  }

  function startNewConvo(){
    const peer = newConvoInput.value.trim();
    if(!peer) return;
    if(safeKey(peer) === safeKey(username)){
      alert("Vous ne pouvez pas discuter avec vous-même 🙂");
      return;
    }
    ensureContact(username, peer).then(() => {
      newConvoInput.value = '';
      openChat(peer);
    });
  }

  function sendMessage(){
    const text = msgInput.value.trim();
    if(!text || !currentPeer) return;
    sendBtn.disabled = true;
    statusLine.textContent = 'Envoi...';
    const key = pairKey(username, currentPeer);
    db.ref('conversations/' + key).push({ user: username, text: text, ts: Date.now() })
      .then(() => {
        msgInput.value = '';
        statusLine.innerHTML = '&nbsp;';
      })
      .catch(() => {
        statusLine.textContent = "Échec de l'envoi, réessayez.";
      })
      .finally(() => {
        sendBtn.disabled = false;
        msgInput.focus();
      });
  }

  // --- Voice messages ---
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  async function toggleRecording(){
    if(!currentPeer) return;
    if(isRecording){
      mediaRecorder.stop();
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        isRecording = false;
        micBtn.classList.remove('recording');
        statusLine.textContent = 'Envoi du vocal...';
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result;
          const key = pairKey(username, currentPeer);
          db.ref('conversations/' + key).push({ user: username, type: 'voice', audio: base64, ts: Date.now() })
            .then(() => { statusLine.innerHTML = '&nbsp;'; })
            .catch(() => { statusLine.textContent = "Échec de l'envoi du vocal."; });
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add('recording');
      statusLine.textContent = 'Enregistrement... appuyez pour arrêter';
    }catch(e){
      alert("Impossible d'accéder au micro. Vérifiez les autorisations de votre navigateur.");
    }
  }

  function enterApp(){
    const val = usernameInput.value.trim();
    if(!val) return;
    username = val;
    meLabel.textContent = 'connecté en tant que ' + username;
    showScreen('list-screen');
    renderContactList();
  }

  function logout(){
    if(currentMsgsRef && currentMsgsHandler){
      currentMsgsRef.off('value', currentMsgsHandler);
    }
    username = null;
    currentPeer = null;
    usernameInput.value = '';
    showScreen('login-screen');
    usernameInput.focus();
  }

  function goBackToList(){
    if(currentMsgsRef && currentMsgsHandler){
      currentMsgsRef.off('value', currentMsgsHandler);
    }
    currentPeer = null;
    showScreen('list-screen');
    renderContactList();
  }

  enterBtn.addEventListener('click', enterApp);
  usernameInput.addEventListener('keydown', e => { if(e.key === 'Enter') enterApp(); });
  newConvoBtn.addEventListener('click', startNewConvo);
  newConvoInput.addEventListener('keydown', e => { if(e.key === 'Enter') startNewConvo(); });
  backBtn.addEventListener('click', goBackToList);
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
  micBtn.addEventListener('click', toggleRecording);
  logoutBtn.addEventListener('click', logout);

})();
</script>
</body>
</html>
